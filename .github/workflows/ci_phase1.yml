name: CI - Phase 1 Baseline Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: "."
  # CI-only JWT secret — not used in production
  AUTH_SECRET_KEY: "ci-test-secret-not-for-production-use-change-before-deploy"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir psutil && pip install -e .

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

  pipeline:
    name: Phase 1 Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir psutil && pip install -e .

      - name: Run Phase 1 pipeline
        run: python -m src.training.pipeline

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: results/
