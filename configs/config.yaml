project:
  name: automated-mlsecops
  version: 1.0.0
  random_seed: 42
  log_level: INFO
paths:
  data_raw: data/raw
  data_processed: data/processed
  models: models
  results: results
  mlflow_uri: sqlite:///mlflow.db
dataset:
  name: adult_with_headers
  source: file
  test_size: 0.2
  validation_size: 0.1
  csv_path: data/raw/cardata.csv
  file_path: data\raw\adult_with_headers.csv
  target_column: target
  task_type: classification
  dataset_id: ds_adult_with_headers_9007ff52
  file_name: adult_with_headers.csv
data_quality:
  min_rows: 20
  min_features: 2
  max_missing_ratio: 0.5
  max_column_missing_ratio: 0.8
  imbalance_threshold: 0.2
  outlier_std_dev: 4.0
  deduplicate: true
  handle_outliers: true
features:
  numerical_strategy: median
  scale: standard
  pca_components: null
training:
  algorithms:
  - logistic_regression
  - random_forest
  - gradient_boosting
  hyperparameters:
    logistic_regression:
      C: 1.0
      max_iter: 1000
      solver: lbfgs
    random_forest:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5
  cv_folds: 5
mlflow:
  experiment_prefix: mlsecops
  model_name: credit_fraud_classifier
  auto_log: true
security:
  dependency_audit: true
  secrets_scan: true
  data_integrity: true
  adversarial_robustness: true
  model_integrity: true
  max_critical_vulns: 0
  max_high_vulns: 2
  min_robustness_score: 0.7
  poisoning_threshold: 0.05
monitoring:
  drift_threshold: 0.1
  latency_p99_ms: 200
  prediction_drift_threshold: 0.15
  check_interval_seconds: 60
auto_response:
  retrain_on_drift: true
  rollback_on_gate_failure: true
  alert_webhook_url: ''
dea:
  inputs:
  - development_time_hours
  - training_time_seconds
  - dataset_size
  - cpu_usage_percent
  - memory_usage_mb
  - labor_effort_hours
  outputs:
  - f1_score
  - robustness_score
  - inference_latency_ms
  - security_pass_rate
api:
  host: 0.0.0.0
  port: 8000
  workers: 1
  reload: false
